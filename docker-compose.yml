services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vevit-backend
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://myuser:secretpassword@db:5432/vevit-v4?schema=public
      - JWT_SECRET=your_jwt_secret
      - GAMMA_CLIENT_ID=2D3KIBB2V9XLLE6A2NXIMDTLTAGVNU
      - GAMMA_REDIRECT_URI=http://localhost:3001/api/auth/gamma/callback
      - GAMMA_CLIENT_SECRET=9MQdBKWw6TN2doFLser8induiNqTUOAu
      - frontend_url=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: vevit-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: vevit-v4
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d vevit-v4"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data: